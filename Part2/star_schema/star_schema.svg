<text x="60" y="873" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334656">Ride grain: fact_ride: intended one row per ride_id; station and date-time have start/end roles.</text>
<text x="60" y="906" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334656">Status grain: fact_station_status: one expanded vehicle-type entry per station from the latest payload; the type ID is not retained.</text>
<text x="60" y="939" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334656">Aggregation: Station-wide availability totals repeat across type entries. Do not sum these rows as independent station observations.</text>
<text x="60" y="972" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334656">Keys and history: Lines show SQL joins, not enforced database PK/FK constraints. No Type 2 station history or separate vehicle-availability dimension.</text>
<text x="60" y="1005" font-family="Arial,sans-serif" font-size="15" font-weight="normal" fill="#334656">Types: Types follow dbt SQL and Bronze DDL. Ride coordinates remain VARCHAR; confirm deployed types with information_schema.columns.</text>
</svg>